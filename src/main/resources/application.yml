server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: aerosaga-drone-mission-control
  datasource:
    url: jdbc:h2:mem:aerosagadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

temporal:
  target: 127.0.0.1:7233
  namespace: default
  task-queue: AeroSagaMissionQueue
  # Default to embedded test server so the app runs out-of-the-box anywhere without external Docker
  use-embedded-test-server: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.infotact.aerosaga: INFO
    io.temporal: WARN
