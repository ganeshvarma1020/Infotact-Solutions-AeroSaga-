server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: "optional:file:./application-local.yml,optional:file:../application-local.yml"
  application:
    name: aerosaga-drone-mission-control
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:aerosaga_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

temporal:
  target: ${TEMPORAL_TARGET:127.0.0.1:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  task-queue: AeroSagaMissionQueue
  use-embedded-test-server: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.infotact.aerosaga: INFO
    org.springframework.security: WARN
    io.temporal: WARN
