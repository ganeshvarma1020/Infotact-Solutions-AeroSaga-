# Production profile. Activated with SPRING_PROFILES_ACTIVE=prod.
# No defaults on purpose: if a variable is missing, the app refuses to start
# instead of running with an unsafe value.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    user:
      name: ${AEROSAGA_USER}
      password: ${AEROSAGA_PASSWORD}

logging:
  level:
    root: INFO
    io.temporal: WARN
